name: Sync project sites

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-project-sites
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out portal
        uses: actions/checkout@v7
        with:
          ref: main
          path: portal

      - name: Check out AI Data
        uses: actions/checkout@v7
        with:
          repository: doublemoreart-dotcom/aidata
          ref: main
          path: sources/aidata
          persist-credentials: false

      - name: Check out TP Trees
        uses: actions/checkout@v7
        with:
          repository: doublemoreart-dotcom/tptrees
          ref: main
          path: sources/tptrees
          persist-credentials: false

      - name: Check out SportTech deployment
        uses: actions/checkout@v7
        with:
          repository: doublemoreart-dotcom/sporttech
          ref: gh-pages
          path: sources/sporttech
          persist-credentials: false

      - name: Check out 48 DIRECTORY deployment
        uses: actions/checkout@v7
        with:
          repository: doublemoreart-dotcom/48DIRECTORY
          ref: gh-pages
          path: sources/48DIRECTORY
          persist-credentials: false

      - name: Check out Small Parties
        uses: actions/checkout@v7
        with:
          repository: doublemoreart-dotcom/small-parties
          ref: main
          path: sources/small-parties
          persist-credentials: false

      - name: Check out Taiwan Food Safety
        uses: actions/checkout@v7
        with:
          repository: doublemoreart-dotcom/taiwan-food-safety
          ref: main
          path: sources/taiwan-food-safety
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sources/taiwan-food-safety/package-lock.json

      - name: Build Taiwan Food Safety
        working-directory: sources/taiwan-food-safety
        run: npm ci && npm run build:pages

      - name: Sync published files
        working-directory: portal
        run: ./scripts/sync-projects.sh ../sources/aidata ../sources/tptrees ../sources/sporttech ../sources/48DIRECTORY ../sources/small-parties ../sources/taiwan-food-safety/out .

      - name: Verify portal routes
        working-directory: portal
        run: node --test tests/*.mjs

      - name: Commit updated snapshots
        working-directory: portal
        run: |
          git add aidata tptrees sporttech 48DIRECTORY small-parties taiwan-food-safety
          if git diff --cached --quiet; then
            echo "Published snapshots are already current."
            exit 0
          fi

          aidata_sha="$(git -C ../sources/aidata rev-parse --short HEAD)"
          tptrees_sha="$(git -C ../sources/tptrees rev-parse --short HEAD)"
          sporttech_sha="$(git -C ../sources/sporttech rev-parse --short HEAD)"
          directory_sha="$(git -C ../sources/48DIRECTORY rev-parse --short HEAD)"
          small_parties_sha="$(git -C ../sources/small-parties rev-parse --short HEAD)"
          taiwan_food_safety_sha="$(git -C ../sources/taiwan-food-safety rev-parse --short HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync project sites" -m "aidata: ${aidata_sha}\ntptrees: ${tptrees_sha}\nsporttech: ${sporttech_sha}\n48DIRECTORY: ${directory_sha}\nsmall-parties: ${small_parties_sha}\ntaiwan-food-safety: ${taiwan_food_safety_sha}"
          git push origin HEAD:main
