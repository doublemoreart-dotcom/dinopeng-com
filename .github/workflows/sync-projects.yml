name: Sync project sites

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: Rebuild and verify every project even when source revisions are unchanged
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-project-sites
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out portal
        uses: actions/checkout@v7
        with:
          ref: main
          path: portal

      - name: Check source revisions
        id: revisions
        working-directory: portal
        env:
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force_sync || false }}
        run: node scripts/project-revisions.mjs check config/project-sources.json .project-sync-state.json

      - name: Check out changed project sources
        if: steps.revisions.outputs.changed == 'true'
        working-directory: portal
        run: node scripts/project-revisions.mjs checkout config/project-sources.json ../sources

      - name: Set up Node.js
        if: steps.revisions.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sources/taiwan-food-safety/package-lock.json

      - name: Build Taiwan Food Safety
        if: steps.revisions.outputs.changed == 'true'
        working-directory: sources/taiwan-food-safety
        run: npm ci && NEXT_BUILD_ID="$(git rev-parse HEAD)" npm run build:pages

      - name: Sync published files
        if: steps.revisions.outputs.changed == 'true'
        working-directory: portal
        run: ./scripts/sync-projects.sh ../sources/aidata ../sources/tptrees ../sources/sporttech ../sources/48DIRECTORY ../sources/small-parties ../sources/taiwan-food-safety/out ../sources/mae ../sources/ccp-stability-spending .

      - name: Verify portal routes
        if: steps.revisions.outputs.changed == 'true'
        working-directory: portal
        run: node --test tests/*.mjs

      - name: Record published revisions
        if: steps.revisions.outputs.changed == 'true'
        working-directory: portal
        run: node scripts/project-revisions.mjs capture config/project-sources.json ../sources .project-sync-state.json

      - name: Commit updated snapshots
        if: steps.revisions.outputs.changed == 'true'
        working-directory: portal
        run: |
          git add .project-sync-state.json aidata tptrees sporttech 48DIRECTORY small-parties taiwan-food-safety mae ccp-stability-spending
          if git diff --cached --quiet; then
            echo "Published snapshots and source revisions are already current."
            exit 0
          fi

          changed_projects="${{ steps.revisions.outputs.changed_projects }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync project sites" -m "Changed sources: ${changed_projects:-forced verification}"
          git push origin HEAD:main
