<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天使牌卡庫｜純本機版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200..900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" as="image" href="assets/placeholder-card.svg" type="image/svg+xml">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200..900&display=swap" rel="stylesheet"></noscript>
  <style>
    :root {
      color-scheme: light;
      --font-serif-tc: "Noto Serif TC", Georgia, "Times New Roman", "PingFang TC", "Microsoft JhengHei", serif;
      --topbar-height: 72px;
      --bg: #f4ede1;
      --paper: #fffaf0;
      --paper-soft: #f9f2e6;
      --ink: #1f211c;
      --muted: #746f66;
      --line: #d8cbb8;
      --line-strong: #b7a892;
      --olive: #59654b;
      --olive-dark: #313a2d;
      --clay: #9a6a45;
      --butter: #efe2bd;
      --success: #eef3df;
      --shadow: 0 24px 70px rgba(49, 42, 32, .22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        linear-gradient(90deg, rgba(31, 33, 28, .035) 1px, transparent 1px) 0 0 / 42px 42px,
        linear-gradient(180deg, #fbf6ec 0%, var(--bg) 46%, #eee2d0 100%);
      color: var(--ink);
      font-family: var(--font-serif-tc);
      line-height: 1.6;
    }

    button,
    input,
    select { font: inherit; }

    button { cursor: pointer; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(248, 240, 226, .88);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 28px));
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
    }

    h1 {
      margin: 0;
      font-family: var(--font-serif-tc);
      font-size: clamp(24px, 4vw, 32px);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 11px;
      background: rgba(255, 250, 240, .78);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .button {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 13px;
      background: var(--olive);
      color: #fff;
      transition: background .16s ease, transform .16s ease, border-color .16s ease;
    }

    .button:hover {
      background: var(--olive-dark);
      transform: translateY(-1px);
    }

    .button.secondary {
      background: var(--paper);
      color: var(--olive-dark);
      border-color: var(--line);
    }

    .button.secondary:hover {
      background: #f1e7d6;
    }

    main {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: stretch;
      margin-bottom: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 250, 240, .76);
      box-shadow: 0 18px 46px rgba(80, 63, 39, .08);
      overflow: hidden;
    }

    .hero-copy {
      padding: clamp(22px, 4vw, 38px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--clay);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .hero-title {
      max-width: none;
      margin: 0;
      font-family: var(--font-serif-tc);
      font-weight: 400;
      font-size: 56px;
      line-height: 1.08;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .hero-text {
      max-width: 660px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2.4vw, 19px);
    }

    .toolbar {
      position: sticky;
      top: calc(var(--topbar-height) - 1px);
      z-index: 18;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(240px, 320px);
      gap: 12px;
      align-items: start;
      margin-bottom: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255, 250, 240, .92);
      box-shadow: 0 16px 36px rgba(80, 63, 39, .1);
      backdrop-filter: blur(14px);
    }

    label,
    .field-label {
      display: grid;
      gap: 7px;
      color: #8d877e;
      font-size: 15px;
      font-weight: 400;
    }

    .field {
      display: grid;
      grid-template-rows: auto 54px;
      gap: 7px;
      min-width: 0;
    }

    input,
    select,
    .multi-button {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 14px;
      background: #fffaf0;
      color: var(--ink);
      font-size: 17px;
      outline: none;
    }

    input::placeholder {
      color: #a19a90;
    }

    input:focus,
    select:focus,
    .multi-button:focus-visible {
      border-color: var(--olive);
      box-shadow: 0 0 0 3px rgba(89, 101, 75, .16);
    }

    .multi-select {
      position: relative;
      display: grid;
      grid-template-rows: auto 54px;
      gap: 7px;
      min-width: 0;
    }

    .multi-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      cursor: pointer;
    }

    .multi-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .multi-arrow {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      color: var(--muted);
      transition: transform .16s ease;
    }

    .multi-select.open .multi-arrow {
      transform: rotate(180deg);
    }

    .multi-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 26;
      display: none;
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: var(--paper);
      box-shadow: 0 18px 44px rgba(49, 42, 32, .18);
    }

    .multi-select.open .multi-menu {
      display: grid;
      gap: 4px;
    }

    .multi-option {
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 7px;
      padding: 9px 10px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
    }

    .multi-option:hover {
      background: #f2e8d9;
    }

    .multi-option input {
      width: 16px;
      min-height: 16px;
      height: 16px;
      accent-color: var(--olive);
      cursor: pointer;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .heading h2 {
      margin: 0;
      font-family: var(--font-serif-tc);
      font-size: 26px;
      font-weight: 600;
    }

    .count {
      color: var(--muted);
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      overflow: hidden;
      text-align: left;
      color: inherit;
      padding: 0;
      box-shadow: 0 10px 28px rgba(80, 63, 39, .08);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, filter .16s ease;
    }

    .card:hover {
      border-color: var(--clay);
      box-shadow: 0 18px 42px rgba(80, 63, 39, .18), 0 0 0 4px rgba(215, 187, 114, .18), 0 0 34px rgba(215, 187, 114, .34);
      filter: saturate(1.04);
      transform: translateY(-2px);
    }

    .card-art,
    .modal-art {
      position: relative;
      overflow: hidden;
      background: #ece4d4;
    }

    .card-art {
      aspect-ratio: 72 / 104;
    }

    .modal-art {
      align-self: start;
      aspect-ratio: 72 / 104;
    }

    .card-art img,
    .modal-image {
      width: 100%;
      aspect-ratio: 72 / 104;
      display: block;
      object-fit: cover;
      background: #ece4d4;
    }

    .card-art img {
      height: 100%;
    }

    .modal-image {
      height: auto;
    }

    .card-image-meta {
      position: absolute;
      left: 50%;
      right: auto;
      top: 50%;
      bottom: auto;
      display: block;
      width: max-content;
      max-width: calc(100% - 24px);
      border: 1px solid rgba(138, 116, 79, .32);
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(255, 250, 240, .84);
      color: var(--olive-dark);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      box-shadow: 0 10px 24px rgba(49, 42, 32, .12);
      backdrop-filter: blur(8px);
      transform: translate(-50%, -50%);
    }

    .modal-art .card-image-meta {
      max-width: calc(100% - 36px);
      padding: 12px 22px;
      font-size: 22px;
    }

    .card-body {
      display: grid;
      gap: 9px;
      padding: 14px;
    }

    .card-title {
      margin: 0;
      font-family: var(--font-serif-tc);
      font-size: 18px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      border: 1px solid #d3b690;
      border-radius: 999px;
      padding: 2px 7px;
      color: #6b5434;
      background: #f8edda;
      font-size: 12px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      background: rgba(255, 255, 255, .55);
      color: var(--muted);
    }

    .site-footer {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 0 0 28px;
      color: rgba(31, 33, 28, .48);
      font-size: 13px;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(31, 33, 28, .62);
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease;
    }

    .modal.active,
    .modal.closing {
      display: flex;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      width: min(900px, 100%);
      max-height: min(860px, calc(100vh - 48px));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border: 1px solid #d7bb72;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
      opacity: 0;
      transform: translateY(48px);
      transition: transform .32s cubic-bezier(.2, .8, .2, 1), opacity .24s ease;
      will-change: transform, opacity;
    }

    .modal.open .modal-panel {
      opacity: 1;
      transform: translateY(0);
      animation: modalSlideIn .34s cubic-bezier(.2, .8, .2, 1) both;
    }

    .modal.closing .modal-panel {
      opacity: 0;
      transform: translateY(48px);
      animation: modalSlideOut .28s ease both;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(64px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalSlideOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(64px);
      }
    }

    .modal-head {
      position: relative;
      padding: 24px 64px 18px 24px;
      border-bottom: 1px solid var(--line);
    }

    .modal-kicker {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 700;
    }

    .modal-title {
      margin: 0;
      font-family: var(--font-serif-tc);
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.18;
    }

    .modal-subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 18px;
    }

    .icon-button {
      position: absolute;
      right: 14px;
      top: 14px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 30px;
      line-height: 1;
    }

    .icon-button:hover { background: #f2eee4; }

    .modal-content {
      min-height: 0;
      overflow: auto;
      padding: 18px 24px;
      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
      gap: 24px;
    }

    .modal-body {
      display: grid;
      gap: 18px;
      align-content: start;
      font-size: 17px;
      line-height: 1.72;
    }

    .modal-body .tag {
      font-size: 13px;
      padding: 3px 8px;
    }

    .section h3 {
      margin: 0 0 6px;
      color: var(--olive-dark);
      font-size: 17px;
    }

    .section p { margin: 0; }

    .affirmation {
      border-radius: 8px;
      padding: 14px 16px;
      background: var(--success);
      color: #315a3a;
      font-size: 17px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 24px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 980px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .toolbar { grid-template-columns: 1fr 220px; }

      .hero-title {
        font-size: 44px;
      }
    }

    @media (max-width: 900px) {
      .modal {
        align-items: stretch;
        padding: 0;
      }

      .modal-panel {
        width: 100%;
        max-height: none;
        min-height: 100vh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      .modal-content {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 22px 18px 96px;
      }

      .modal-art {
        width: min(52vw, 360px);
        height: min(75vw, 520px);
        flex: 0 0 auto;
        align-self: center;
        justify-self: center;
      }

      .modal-art .modal-image {
        height: 100%;
      }

      .modal-body {
        width: min(100%, 720px);
        justify-self: center;
        align-self: center;
      }

      .modal-body .tags {
        justify-content: center;
      }

      .modal-actions {
        position: sticky;
        bottom: 0;
        justify-content: stretch;
        padding: 14px 24px;
        background: rgba(255, 250, 240, .96);
        backdrop-filter: blur(10px);
      }

      .modal-actions .button {
        flex: 1 1 140px;
      }
    }

    @media (max-width: 720px) {
      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
        justify-content: flex-start;
      }

      .toolbar { grid-template-columns: 1fr; }
      .hero-copy {
        padding: 20px;
      }

      .hero-title {
        font-size: 34px;
        white-space: normal;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .modal-head {
        padding: 20px 54px 16px 20px;
      }

      .modal-title {
        font-size: clamp(34px, 11vw, 46px);
      }

      .modal-subtitle {
        font-size: 18px;
      }

      .modal-content {
        gap: 14px;
        padding: 16px 16px 92px;
      }

      .modal-art {
        width: min(64vw, 260px);
        height: min(92vw, 376px);
      }

      .modal-art .card-image-meta {
        max-width: calc(100% - 24px);
        padding: 8px 14px;
        font-size: 16px;
      }

      .modal-body {
        gap: 12px;
        font-size: 17px;
        line-height: 1.74;
      }

      .modal-body .tags {
        justify-content: center;
        padding-bottom: 4px;
      }

      .modal-body .tag {
        font-size: 14px;
        padding: 3px 9px;
      }

      .section {
        border: 1px solid rgba(216, 203, 184, .72);
        border-radius: 8px;
        padding: 14px 15px;
        background: rgba(255, 250, 240, .72);
      }

      .section h3 {
        margin-bottom: 8px;
        font-size: 19px;
      }

      .affirmation {
        padding: 15px;
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .modal,
      .modal-panel {
        transition: none;
        animation: none;
      }
    }

    @media (max-width: 360px) {
      .grid { grid-template-columns: 1fr; }
      .hero-title { font-size: 30px; }

      .modal-head {
        padding: 18px 48px 14px 18px;
      }

      .modal-title {
        font-size: 32px;
      }

      .modal-art {
        width: min(68vw, 220px);
        height: min(98vw, 318px);
      }

      .icon-button {
        right: 10px;
        top: 10px;
        width: 36px;
        height: 36px;
        font-size: 26px;
      }

      main,
      .topbar-inner,
      .site-footer { width: min(100% - 20px, 1180px); }
    }
  </style>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div>
        <h1>天使牌卡庫</h1>
        <p class="subtitle">Oatmeal-inspired local oracle library.</p>
      </div>
      <div class="actions">
        <button class="button" id="drawButton" type="button">隨機抽一張</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" aria-label="天使牌卡庫介紹">
      <div class="hero-copy">
        <p class="eyebrow">Local oracle archive</p>
        <h2 class="hero-title">一套溫柔、可離線使用的天使牌查找工具。</h2>
        <p class="hero-text">依照當下感受搜尋、篩選或抽一張牌，查看每張卡的完整指引。</p>
      </div>
    </section>

    <section class="toolbar" aria-label="卡牌查找工具">
      <label class="field">
        搜尋
        <input id="searchInput" type="search" placeholder="例：排名、天使、關鍵字、訊息">
      </label>
      <div class="multi-select" id="categoryMultiSelect">
        <span class="field-label" id="categoryLabel">分類</span>
        <button class="multi-button" id="categoryButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="categoryLabel categoryButtonText">
          <span class="multi-label" id="categoryButtonText">全部分類</span>
          <svg class="multi-arrow" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M5.5 7.5 10 12l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="multi-menu" id="categoryMenu" role="listbox" aria-multiselectable="true" aria-labelledby="categoryLabel"></div>
      </div>
    </section>

    <section>
      <div class="heading">
        <h2>全部卡牌</h2>
        <span class="count" id="resultCount">0 張</span>
      </div>
      <div class="grid" id="cardGrid"></div>
    </section>
  </main>

  <footer class="site-footer">
    Copyright © 2026 麥堂主. All rights reserved.
  </footer>

  <div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel">
      <div class="modal-head">
        <p class="modal-kicker" id="modalKicker"></p>
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-subtitle" id="modalSubtitle"></p>
        <button class="icon-button" id="closeButton" type="button" aria-label="關閉詳情">×</button>
      </div>
      <div class="modal-content">
        <div class="modal-art">
          <img class="modal-image" id="modalImage" src="assets/placeholder-card.svg" alt="">
          <span class="card-image-meta" id="modalImageMeta"></span>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
      <div class="modal-actions">
        <button class="button" id="modalDrawButton" type="button">再抽一張</button>
      </div>
    </div>

  <script>

      row.push(value);
      if (row.some((cell) => cell.trim() !== "")) rows.push(row);
      if (rows.length === 0) return [];

      const headers = rows[0].map((header) => header.trim());
      return rows.slice(1).map((cells) => {
        const record = {};
        headers.forEach((header, index) => {
          record[header] = (cells[index] || "").trim();
        });
        return record;
      });
    }

    function normalizeCards(rows) {
      return rows
        .filter((row) => String(row.is_active || "").trim().toUpperCase() === "TRUE")
        .map((row, index) => {
          const keywordList = String(row.keywords || "")
            .split(",")
            .map((keyword) => keyword.trim())
            .filter(Boolean);
          const sortOrder = Number.parseFloat(row.sort_order);

          return {
            id: row.id || "card-" + (index + 1),
            name: row.name || "未命名牌卡",
            angel: row.angel || "未指定天使",
            subtitle: row.subtitle || "",
            keywords: row.keywords || "",
            keywordList,
            category: row.category || "未分類",
            message: row.message || "",
            detail: row.detail || "",
            guidance: row.guidance || "",
            affirmation: row.affirmation || "",
            image: row.image || PLACEHOLDER_IMAGE,
            sort_order: Number.isFinite(sortOrder) ? sortOrder : index + 1
          };
        })
        .sort((a, b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name, "zh-Hant"));
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function cardIdFromHash(hash) {
      const match = String(hash || "").match(/(?:^#|&)card=([^&]+)/);
      if (!match) return "";
      const id = decodeURIComponent(match[1]);
      return LEGACY_CARD_ALIASES[id] || id;
    }

    function uniqueCategories(cards) {
      return [...new Set(cards.map((card) => card.category).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "zh-Hant"));
    }

    function filterCards() {
      const query = els.searchInput.value.trim().toLocaleLowerCase();
      state.filtered = state.cards.filter((card) => {
        if (state.selectedCategories.size > 0 && !state.selectedCategories.has(card.category)) return false;
        if (!query) return true;
        return [
          card.name,
          card.angel,
          card.subtitle,
          card.keywords,
          card.category,
          card.message,
          card.detail,
          card.guidance,
          card.affirmation
        ].join(" ").toLocaleLowerCase().includes(query);
      });
      renderCards();
    }

    function updateCategoryButtonText() {
      if (state.selectedCategories.size === 0) {
        els.categoryButtonText.textContent = "全部分類";
        return;
      }

      const selected = [...state.selectedCategories];
      els.categoryButtonText.textContent = selected.length <= 2
        ? selected.join("、")
        : selected.slice(0, 2).join("、") + " +" + (selected.length - 2);
    }

    function toggleCategoryMenu(forceOpen) {
      const shouldOpen = typeof forceOpen === "boolean"
        ? forceOpen
        : !els.categoryMultiSelect.classList.contains("open");
      els.categoryMultiSelect.classList.toggle("open", shouldOpen);
      els.categoryButton.setAttribute("aria-expanded", String(shouldOpen));
    }

    function renderCategories() {
      els.categoryMenu.innerHTML = "";
      for (const category of uniqueCategories(state.cards)) {
        const option = document.createElement("label");
        option.className = "multi-option";
        option.innerHTML = '<input type="checkbox" value="' + escapeHtml(category) + '"><span>' + escapeHtml(category) + '</span>';
        const checkbox = option.querySelector("input");
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) {
            state.selectedCategories.add(category);
          } else {
            state.selectedCategories.delete(category);
          }
          updateCategoryButtonText();
          filterCards();
        });
        els.categoryMenu.append(option);
      }
      updateCategoryButtonText();
    }

    function renderCards() {
      els.cardGrid.innerHTML = "";
      els.resultCount.textContent = state.filtered.length + " 張";

      if (state.filtered.length === 0) {
        els.cardGrid.innerHTML = '<div class="empty">找不到符合條件的卡牌。</div>';
        return;
      }

      for (const card of state.filtered) {
        const button = document.createElement("button");
        button.className = "card";
        button.type = "button";
        const cardMeta = card.angel + " · " + card.category;
        button.setAttribute("aria-label", card.name + "，" + cardMeta);
        button.innerHTML = [
          '<div class="card-art">',
          '<img src="' + escapeHtml(card.image) + '" alt="' + escapeHtml(card.name) + '" loading="lazy">',
          '<span class="card-image-meta">' + escapeHtml(cardMeta) + '</span>',
          '</div>',
          '<div class="card-body">',
          '<h3 class="card-title">' + escapeHtml(card.name) + '</h3>',
          '<div class="tags">' + card.keywordList.slice(0, 3).map((keyword) => '<span class="tag">' + escapeHtml(keyword) + '</span>').join("") + '</div>',
          '</div>'
        ].join("");
        button.querySelector("img").addEventListener("error", (event) => {
          event.currentTarget.src = PLACEHOLDER_IMAGE;
        });
        button.addEventListener("click", () => selectCard(card, true));
        els.cardGrid.append(button);
      }
    }

    function renderModal(card) {
      els.modalKicker.textContent = card.angel + " · " + card.category;
      els.modalTitle.textContent = card.name;
      els.modalSubtitle.textContent = card.subtitle;
      els.modalImage.src = card.image || PLACEHOLDER_IMAGE;
      els.modalImage.alt = card.name;
      els.modalImageMeta.textContent = card.angel + " · " + card.category;
      els.modalBody.innerHTML = [
        '<div class="tags">' + card.keywordList.map((keyword) => '<span class="tag">' + escapeHtml(keyword) + '</span>').join("") + '</div>',
        '<section class="section"><h3>主要訊息</h3><p>' + escapeHtml(card.message) + '</p></section>',
        '<section class="section"><h3>詳細解釋</h3><p>' + escapeHtml(card.detail) + '</p></section>',
        '<section class="section"><h3>今日指引</h3><p>' + escapeHtml(card.guidance) + '</p></section>',
        '<p class="affirmation">' + escapeHtml(card.affirmation) + '</p>'
      ].join("");
      els.modalImage.onerror = () => {
        els.modalImage.src = PLACEHOLDER_IMAGE;
      };
    }

    function selectCard(card, updateHash) {
      state.selected = card;
      renderModal(card);
      window.clearTimeout(modalCloseTimer);
      window.cancelAnimationFrame(modalOpenFrame);
      els.detailModal.classList.remove("closing");
      els.detailModal.classList.add("active");
      void els.detailModal.offsetHeight;
      modalOpenFrame = window.requestAnimationFrame(() => {
        els.detailModal.classList.add("open");
      });
      if (updateHash) {
        history.replaceState(null, "", "#card=" + encodeURIComponent(card.id));
      }
    }

    function closeModal() {
      if (!els.detailModal.classList.contains("active")) return;
      window.cancelAnimationFrame(modalOpenFrame);
      els.detailModal.classList.remove("open");
      els.detailModal.classList.add("closing");
      window.clearTimeout(modalCloseTimer);
      modalCloseTimer = window.setTimeout(() => {
        els.detailModal.classList.remove("active");
        els.detailModal.classList.remove("closing");
        state.selected = null;
      }, 340);
      history.replaceState(null, "", location.pathname);
    }

    function drawCard() {
      if (state.cards.length === 0) return;
      selectCard(state.cards[Math.floor(Math.random() * state.cards.length)], true);
    }

    function init() {
      syncStickyOffset();
      state.cards = normalizeCards(parseCsv(RAW_CSV));
      state.filtered = state.cards;
      renderCategories();
      renderCards();

      const initialCardId = cardIdFromHash(location.hash);
      const initialCard = state.cards.find((card) => card.id === initialCardId);
      if (initialCard) selectCard(initialCard, false);
    }

    window.addEventListener("resize", syncStickyOffset);
    els.searchInput.addEventListener("input", filterCards);
    els.categoryButton.addEventListener("click", () => toggleCategoryMenu());
    els.drawButton.addEventListener("click", drawCard);
    els.modalDrawButton.addEventListener("click", drawCard);
    els.closeButton.addEventListener("click", closeModal);
    els.detailModal.addEventListener("click", (event) => {
      if (event.target === els.detailModal) closeModal();
    });
    document.addEventListener("click", (event) => {
      if (!els.categoryMultiSelect.contains(event.target)) toggleCategoryMenu(false);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (els.detailModal.classList.contains("active")) closeModal();
        toggleCategoryMenu(false);
      }
    });

    init();
  </script>
</body>
</html>
